<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#007c8c",
                        "background-light": "#fbf9f7",
                        "background-dark": "#1b3133",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>body {
    font-family: "Manrope", sans-serif;
    -webkit-tap-highlight-color: transparent
    }
.ios-shadow {
    box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05)
    }
select {
    appearance: none;
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuCnfABLG4KBEMz2NsIC6PSFlngEGaWJkqV5qENHARA3qZPzN1ux3ng5EQc6S8_4aYJNjDKZoYhQY5kcOQESiauBSgt_SosPR3Od5EnHJoYKZB39iBSjlufbEZP6zHelXKponkz6lRqhlnR1W5WahK650tgKabKUhmnl53WsupdOFpuQZX3HCvHogW9y5H5U2WWHafawwq-AQoys36F0dhEhpuohyJO4ra8LGstA8Wm5rE2p4MGxnb9SFPrnC7iqFquJX2p0-8ds2M8);
    background-position: right 1rem center;
    background-repeat: no-repeat;
    background-size: 1.5em 1.5em
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen font-display text-[#0c1b1d] dark:text-white">
<div class="max-w-[480px] mx-auto min-h-screen flex flex-col relative pb-32">
<!-- Top App Bar -->
<header class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md px-4 py-4 flex items-center justify-between">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-gray-100 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-primary">arrow_back_ios_new</span>
</button>
<h1 class="text-lg font-bold tracking-tight">Nueva Reserva</h1>
<button class="flex items-center justify-center size-10 rounded-full hover:bg-gray-100 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-primary">more_horiz</span>
</button>
</header>
<main class="flex-1 px-4 pt-4">
<!-- Form Container Card -->
<div class="bg-white dark:bg-[#243d40] rounded-xl p-6 ios-shadow space-y-6">
<!-- Platform Selection -->
<div class="space-y-2">
<label class="text-sm font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Canal de Reserva</label>
<div class="grid grid-cols-3 gap-2">
<button class="flex flex-col items-center justify-center p-3 rounded-lg border-2 border-primary bg-primary/5 text-primary">
<span class="material-symbols-outlined mb-1">home_work</span>
<span class="text-xs font-bold">Airbnb</span>
</button>
<button class="flex flex-col items-center justify-center p-3 rounded-lg border-2 border-transparent bg-gray-50 dark:bg-white/5 text-gray-400">
<span class="material-symbols-outlined mb-1">confirmation_number</span>
<span class="text-xs font-bold">Booking</span>
</button>
<button class="flex flex-col items-center justify-center p-3 rounded-lg border-2 border-transparent bg-gray-50 dark:bg-white/5 text-gray-400">
<span class="material-symbols-outlined mb-1">person</span>
<span class="text-xs font-bold">Directa</span>
</button>
</div>
</div>
<hr class="border-gray-100 dark:border-white/5"/>
<!-- Dates Selection -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="text-sm font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Check-in</label>
<div class="relative">
<input class="w-full h-12 bg-gray-50 dark:bg-white/5 border-none rounded-lg px-4 focus:ring-2 focus:ring-primary/50 text-base" placeholder="DD/MM/AA" type="text"/>
<span class="material-symbols-outlined absolute right-3 top-3 text-gray-400 text-sm">calendar_today</span>
</div>
</div>
<div class="space-y-2">
<label class="text-sm font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Check-out</label>
<div class="relative">
<input class="w-full h-12 bg-gray-50 dark:bg-white/5 border-none rounded-lg px-4 focus:ring-2 focus:ring-primary/50 text-base" placeholder="DD/MM/AA" type="text"/>
<span class="material-symbols-outlined absolute right-3 top-3 text-gray-400 text-sm">calendar_today</span>
</div>
</div>
</div>
<!-- Guest Name -->
<div class="space-y-2">
<label class="text-sm font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Nombre del Huésped</label>
<div class="relative">
<input class="w-full h-12 bg-gray-50 dark:bg-white/5 border-none rounded-lg px-4 focus:ring-2 focus:ring-primary/50 text-base" placeholder="Ej. Juan Pérez" type="text"/>
<span class="material-symbols-outlined absolute right-3 top-3 text-gray-400">person_outline</span>
</div>
</div>
<!-- Total Price -->
<div class="space-y-2">
<label class="text-sm font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Precio Total (USD)</label>
<div class="relative">
<input class="w-full h-14 bg-gray-50 dark:bg-white/5 border-none rounded-lg px-4 pl-12 focus:ring-2 focus:ring-primary text-xl font-bold text-primary" placeholder="0.00" type="number"/>
<span class="absolute left-4 top-1/2 -translate-y-1/2 font-bold text-primary text-lg">$</span>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">payments</span>
</div>
</div>
<!-- Notes -->
<div class="space-y-2">
<label class="text-sm font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Notas Adicionales</label>
<textarea class="w-full bg-gray-50 dark:bg-white/5 border-none rounded-lg px-4 py-3 focus:ring-2 focus:ring-primary/50 text-base resize-none" placeholder="Detalles del vuelo, preferencias, etc..." rows="3"></textarea>
</div>
</div>
</main>
<!-- Fixed Bottom Action Bar -->
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] p-6 bg-gradient-to-t from-background-light dark:from-background-dark via-background-light/95 dark:via-background-dark/95 to-transparent">
<button class="w-full h-14 bg-primary text-white rounded-xl font-bold text-lg flex items-center justify-center gap-2 shadow-lg shadow-primary/30 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined">save</span>
                Guardar Reserva
            </button>
<!-- iOS Indicator Spacer -->
<div class="h-4"></div>
</div>
</div>
</body></html>
