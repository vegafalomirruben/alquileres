<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Calendario de Disponibilidad</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#007c8c",
                        "background-light": "#fbf9f7",
                        "background-dark": "#1b3133",
                        "airbnb": "#FF5A5F",
                        "booking": "#003580",
                        "direct": "#5A9D6A",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .calendar-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            margin-top: 2px;
        }
        .booking-span {
            height: 4px;
            border-radius: 2px;
            margin-top: 2px;
            width: 80%;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#0c1b1d] dark:text-white min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md px-4 pt-4 pb-2">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<button class="flex size-10 items-center justify-center rounded-full bg-white dark:bg-zinc-800 shadow-sm">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<div>
<h1 class="text-lg font-bold leading-tight">Calendario</h1>
<p class="text-xs text-zinc-500 font-medium">Villa Mar Azul</p>
</div>
</div>
<div class="flex gap-2">
<button class="flex size-10 items-center justify-center rounded-full bg-white dark:bg-zinc-800 shadow-sm">
<span class="material-symbols-outlined">search</span>
</button>
<button class="flex size-10 items-center justify-center rounded-full bg-white dark:bg-zinc-800 shadow-sm">
<span class="material-symbols-outlined">tune</span>
</button>
</div>
</div>
</header>
<!-- Platform Legend Chips -->
<section class="px-4 py-4">
<div class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide">
<div class="flex h-9 shrink-0 items-center gap-x-2 rounded-full bg-white dark:bg-zinc-800 px-4 shadow-sm border border-zinc-100 dark:border-zinc-700">
<div class="size-2 rounded-full bg-airbnb"></div>
<p class="text-sm font-medium">Airbnb</p>
</div>
<div class="flex h-9 shrink-0 items-center gap-x-2 rounded-full bg-white dark:bg-zinc-800 px-4 shadow-sm border border-zinc-100 dark:border-zinc-700">
<div class="size-2 rounded-full bg-booking"></div>
<p class="text-sm font-medium">Booking</p>
</div>
<div class="flex h-9 shrink-0 items-center gap-x-2 rounded-full bg-white dark:bg-zinc-800 px-4 shadow-sm border border-zinc-100 dark:border-zinc-700">
<div class="size-2 rounded-full bg-direct"></div>
<p class="text-sm font-medium">Directo</p>
</div>
</div>
</section>
<!-- Monthly Calendar View -->
<main class="flex-1 px-4">
<div class="bg-white dark:bg-zinc-800/50 rounded-2xl shadow-sm border border-zinc-100 dark:border-zinc-700 overflow-hidden">
<!-- Calendar Header -->
<div class="flex items-center justify-between p-4 border-b border-zinc-50 dark:border-zinc-700/50">
<button class="text-zinc-400 hover:text-primary">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<h2 class="text-base font-bold">Octubre 2023</h2>
<button class="text-zinc-400 hover:text-primary">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
<!-- Calendar Grid -->
<div class="p-2">
<div class="grid grid-cols-7 mb-2">
<div class="text-center text-[11px] font-bold text-zinc-400 uppercase tracking-wider h-8 flex items-center justify-center">Dom</div>
<div class="text-center text-[11px] font-bold text-zinc-400 uppercase tracking-wider h-8 flex items-center justify-center">Lun</div>
<div class="text-center text-[11px] font-bold text-zinc-400 uppercase tracking-wider h-8 flex items-center justify-center">Mar</div>
<div class="text-center text-[11px] font-bold text-zinc-400 uppercase tracking-wider h-8 flex items-center justify-center">Mié</div>
<div class="text-center text-[11px] font-bold text-zinc-400 uppercase tracking-wider h-8 flex items-center justify-center">Jue</div>
<div class="text-center text-[11px] font-bold text-zinc-400 uppercase tracking-wider h-8 flex items-center justify-center">Vie</div>
<div class="text-center text-[11px] font-bold text-zinc-400 uppercase tracking-wider h-8 flex items-center justify-center">Sáb</div>
</div>
<div class="grid grid-cols-7 gap-px bg-zinc-50 dark:bg-zinc-700">
<!-- Week 1 (Starts Wed) -->
<div class="bg-white dark:bg-zinc-800 h-16"></div>
<div class="bg-white dark:bg-zinc-800 h-16"></div>
<div class="bg-white dark:bg-zinc-800 h-16"></div>
<button class="bg-white dark:bg-zinc-800 h-16 flex flex-col items-center pt-2 relative">
<span class="text-sm font-medium">1</span>
</button>
<button class="bg-white dark:bg-zinc-800 h-16 flex flex-col items-center pt-2 relative">
<span class="text-sm font-medium">2</span>
<div class="booking-span bg-direct"></div>
</button>
<button class="bg-white dark:bg-zinc-800 h-16 flex flex-col items-center pt-2 relative">
<span class="text-sm font-medium">3</span>
<div class="booking-span bg-direct"></div>
</button>
<button class="bg-white dark:bg-zinc-800 h-16 flex flex-col items-center pt-2 relative">
<span class="text-sm font-medium">4</span>
<div class="booking-span bg-direct"></div>
</button>
<!-- Week 2 -->
<button class="bg-white dark:bg-zinc-800 h-16 flex flex-col items-center pt-2 relative">
<span class="text-sm font-medium">5</span>
</button>
<button class="bg-white dark:bg-zinc-800 h-16 flex flex-col items-center pt-2 relative">
<span class="text-sm font-medium">6</span>
</button>
<button class="bg-white dark:bg-zinc-800 h-16 flex flex-col items-center pt-2 relative">
<span class="text-sm font-medium">7</span>
<div class="booking-span bg-booking"></div>
</button>
<button class="bg-white dark:bg-zinc-800 h-16 flex flex-col items-center pt-2 relative">
<span class="text-sm font-medium">8</span>
<div class="booking-span bg-booking"></div>
</button>
<button class="bg-white dark:bg-zinc-800 h-16 flex flex-col items-center pt-2 relative">
<span class="text-sm font-medium">9</span>
</button>
<button class="bg-white dark:bg-zinc-800 h-16 flex flex-col items-center pt-2 relative">
<span class="text-sm font-medium">10</span>
</button>
<button class="bg-white dark:bg-zinc-800 h-16 flex flex-col items-center pt-2 relative">
<span class="text-sm font-medium text-primary font-bold">11</span>
<div class="size-1 bg-primary rounded-full absolute bottom-2"></div>
</button>
<!-- Week 3 (Selection starts here) -->
<button class="bg-white dark:bg-zinc-800 h-16 flex flex-col items-center pt-2 relative ring-2 ring-primary ring-inset z-10 bg-primary/5">
<span class="text-sm font-bold">12</span>
<div class="booking-span bg-airbnb"></div>
</button>
<button class="bg-white dark:bg-zinc-800 h-16 flex flex-col items-center pt-2 relative">
<span class="text-sm font-medium">13</span>
<div class="booking-span bg-airbnb"></div>
</button>
<button class="bg-white dark:bg-zinc-800 h-16 flex flex-col items-center pt-2 relative">
<span class="text-sm font-medium">14</span>
<div class="booking-span bg-airbnb"></div>
</button>
<button class="bg-white dark:bg-zinc-800 h-16 flex flex-col items-center pt-2 relative">
<span class="text-sm font-medium">15</span>
<div class="booking-span bg-airbnb"></div>
</button>
<button class="bg-white dark:bg-zinc-800 h-16 flex flex-col items-center pt-2 relative">
<span class="text-sm font-medium">16</span>
</button>
<button class="bg-white dark:bg-zinc-800 h-16 flex flex-col items-center pt-2 relative">
<span class="text-sm font-medium">17</span>
</button>
<button class="bg-white dark:bg-zinc-800 h-16 flex flex-col items-center pt-2 relative">
<span class="text-sm font-medium">18</span>
</button>
<!-- Remaining dates truncated for UI -->
<button class="bg-white dark:bg-zinc-800 h-16 flex flex-col items-center pt-2 relative">
<span class="text-sm font-medium">19</span>
</button>
<button class="bg-white dark:bg-zinc-800 h-16 flex flex-col items-center pt-2 relative">
<span class="text-sm font-medium text-zinc-300">...</span>
</button>
<button class="bg-white dark:bg-zinc-800 h-16 flex flex-col items-center pt-2 relative">
<span class="text-sm font-medium">31</span>
</button>
</div>
</div>
</div>
</main>
<!-- Floating Action Button -->
<div class="fixed right-6 bottom-32 z-20">
<button class="size-14 rounded-full bg-primary text-white shadow-lg flex items-center justify-center transition-transform active:scale-95">
<span class="material-symbols-outlined text-3xl">add</span>
</button>
</div>
<!-- Summary Sheet (Fixed Bottom) -->
<div class="mt-auto px-4 pb-6">
<div class="bg-white dark:bg-zinc-800 rounded-2xl shadow-xl border border-zinc-100 dark:border-zinc-700 p-4">
<div class="flex items-center justify-between mb-4">
<h3 class="text-sm font-bold text-zinc-400 uppercase tracking-widest">Resumen de Reserva</h3>
<span class="material-symbols-outlined text-zinc-300">drag_handle</span>
</div>
<div class="flex items-center gap-4">
<!-- User Image / Initial -->
<div class="size-14 rounded-xl bg-center bg-cover bg-no-repeat shrink-0" data-alt="Portrait of a male guest for reservation" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCrKFLgSEZgCI6YPTJJwnNQiTZinhvDrA5BRcjyYx65ItvzjYILbrE2m37bxkv6Y-ZJW2jMFN9cv02NNaxxUtDUHf70ucaSVyWxATgIXVaczDdH5g5pIbkX78ajfl2OZD2tr-5FlVRqvuMV1i6mtxzV--KcsSot8rUijmOy0VMNfnjtA36LmWkJbqzaqICYhVawabZQU_sHpv5OHsadUaiGm98ZN1QqcAN6x7HlsyHRfaLzZrWjHuwRPEGg4dKoHmr5yMYPVP4QEgo");'>
</div>
<div class="flex-1">
<div class="flex items-center gap-2 mb-0.5">
<p class="font-bold text-lg leading-tight">John Doe</p>
<span class="bg-airbnb/10 text-airbnb text-[10px] font-bold px-1.5 py-0.5 rounded uppercase">Airbnb</span>
</div>
<p class="text-sm text-zinc-500 font-medium">12 Oct - 15 Oct (3 noches)</p>
</div>
<div class="text-right">
<p class="text-xs text-zinc-400 font-medium">Pago total</p>
<p class="text-lg font-bold text-primary">$450.00</p>
</div>
</div>
<div class="mt-4 flex gap-2">
<button class="flex-1 flex items-center justify-center gap-2 bg-primary/10 text-primary h-11 rounded-xl font-bold text-sm">
<span class="material-symbols-outlined text-lg">chat_bubble</span>
                    Contactar
                </button>
<button class="flex-[1.5] flex items-center justify-center gap-2 bg-primary text-white h-11 rounded-xl font-bold text-sm">
                    Ver detalles
                    <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</div>
</div>
<!-- Bottom Navigation Bar (iOS Style) -->
<nav class="bg-white dark:bg-zinc-900 border-t border-zinc-100 dark:border-zinc-800 px-8 py-2 pb-6 flex justify-between items-center">
<button class="flex flex-col items-center gap-1 text-zinc-400">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-medium">Inicio</span>
</button>
<button class="flex flex-col items-center gap-1 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">calendar_today</span>
<span class="text-[10px] font-medium">Calendario</span>
</button>
<button class="flex flex-col items-center gap-1 text-zinc-400">
<span class="material-symbols-outlined">bar_chart</span>
<span class="text-[10px] font-medium">Finanzas</span>
</button>
<button class="flex flex-col items-center gap-1 text-zinc-400">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-medium">Perfil</span>
</button>
</nav>
</body></html>
