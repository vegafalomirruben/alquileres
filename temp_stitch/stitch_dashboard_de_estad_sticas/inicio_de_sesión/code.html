<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Inicio de Sesión - Property Manager</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1C6D7D",
                        "background-light": "#f5f5f4",
                        "background-dark": "#1a1d23",
                    },
                    fontFamily: {
                        "display": ["Manrope"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden max-w-[480px] mx-auto shadow-2xl bg-white dark:bg-background-dark">
<!-- Top Navigation -->
<div class="flex items-center bg-white dark:bg-background-dark p-4 pb-2 justify-between">
<div class="text-[#141513] dark:text-white flex size-12 shrink-0 items-center justify-start cursor-pointer">
<span class="material-symbols-outlined">arrow_back_ios</span>
</div>
<h2 class="text-[#141513] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Inicio de Sesión</h2>
</div>
<!-- Header Lifestyle Image -->
<div class="@container">
<div class="px-4 py-3">
<div class="w-full bg-center bg-no-repeat bg-cover flex flex-col justify-end overflow-hidden bg-white rounded-xl min-h-64 shadow-sm" data-alt="Sunlit cozy modern living room interior" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCaxEiQNfuUfjdLGExR29hqlYJkRQM37cn1XJZ96pkSjgl7Z53Gw2HAsJOu-qFJjO9xHHxhaNLpOIDFfDV2SIkw_eQjlf9u1HdVQthjl7Vgu3JeT9X1kb4QriMeHeNSzGeZVqAJQUE2lwkTL7S3w2z5d9bujK-zgWX2WYE7qEdO7qfvyjFr1pO2ZxSlcxo3iRopkEGFLNaYIpFgdx8sThJuk9ThywFtICqXay3u5Qz_ztanKPHF9W3WlH25d1UB-yo9pFU4GBPcYUY");'>
</div>
</div>
</div>
<!-- Welcome Headlines -->
<div class="px-4">
<h2 class="text-[#141513] dark:text-white tracking-tight text-[28px] font-bold leading-tight text-center pb-2 pt-4">Bienvenido de nuevo</h2>
<p class="text-[#4b4b4b] dark:text-gray-400 text-base font-normal leading-normal pb-6 text-center">Gestiona tus propiedades de Airbnb y Booking con facilidad.</p>
</div>
<!-- Login Form Fields -->
<div class="flex flex-col gap-4 px-4">
<!-- Email Field -->
<label class="flex flex-col w-full">
<p class="text-[#141513] dark:text-gray-200 text-sm font-semibold leading-normal pb-2 px-1">Correo electrónico</p>
<input class="form-input flex w-full rounded-lg text-[#141513] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dfe2df] dark:border-gray-700 bg-white dark:bg-gray-800 h-14 placeholder:text-[#727b6f] p-[15px] text-base font-normal" placeholder="ejemplo@correo.com" type="email"/>
</label>
<!-- Password Field -->
<label class="flex flex-col w-full">
<div class="flex justify-between items-center pb-2 px-1">
<p class="text-[#141513] dark:text-gray-200 text-sm font-semibold leading-normal">Contraseña</p>
<a class="text-primary text-sm font-bold hover:underline" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative">
<input class="form-input flex w-full rounded-lg text-[#141513] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dfe2df] dark:border-gray-700 bg-white dark:bg-gray-800 h-14 placeholder:text-[#727b6f] p-[15px] text-base font-normal" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer">visibility</span>
</div>
</label>
</div>
<!-- Main Action Button -->
<div class="px-4 pt-8 pb-4">
<button class="w-full h-14 bg-primary hover:bg-opacity-90 transition-all text-white rounded-xl font-bold text-lg shadow-lg shadow-primary/20">
                Iniciar Sesión
            </button>
</div>
<!-- Divider -->
<div class="flex items-center px-4 py-4 gap-4">
<div class="h-[1px] flex-1 bg-gray-200 dark:bg-gray-700"></div>
<span class="text-gray-400 text-sm font-medium">o continuar con</span>
<div class="h-[1px] flex-1 bg-gray-200 dark:bg-gray-700"></div>
</div>
<!-- Social Auth Buttons -->
<div class="flex flex-col gap-3 px-4 pb-8">
<button class="flex items-center justify-center gap-3 w-full h-14 bg-white dark:bg-gray-800 border border-[#dfe2df] dark:border-gray-700 rounded-xl font-semibold text-[#141513] dark:text-white hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
</svg>
                Google
            </button>
<button class="flex items-center justify-center gap-3 w-full h-14 bg-black text-white rounded-xl font-semibold hover:bg-gray-900 transition-colors">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.98.95-2.05 1.79-3.48 1.79-1.42 0-1.85-.86-3.54-.86-1.69 0-2.18.83-3.51.86-1.31.03-2.45-.89-3.44-1.84-2.01-1.92-3.54-5.43-3.54-8.73 0-3.3 2.1-5.04 4.12-5.04 1.06 0 1.91.41 2.85.82 1.01.44 1.76.62 2.61.62.77 0 1.64-.17 2.69-.65 1.11-.51 2.22-.96 3.51-.83 1.06.11 2.41.5 3.35 1.83-2.31 1.35-1.94 4.5-.02 5.31-1.04 2.54-2.46 4.67-3.45 5.72zm-2.85-16.7c.02-2.31-1.91-4.22-4.14-4.24-.03 2.37 2.05 4.34 4.14 4.24z"></path>
</svg>
                Apple
            </button>
</div>
<!-- Footer -->
<div class="mt-auto pb-10 text-center">
<p class="text-gray-500 dark:text-gray-400 text-sm">
                ¿No tienes una cuenta? 
                <a class="text-primary font-bold hover:underline" href="#">Regístrate</a>
</p>
</div>
</div>
</body></html>
